<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GhostHaus Xmas Jeopardy!</title>
<style>
:root{--bg:#f3f4f9;--fg:#14172b;--card:#fff;--line:#d3d8e8;--mute:#5d6485;--blue:#0a1a8c;--gold:#ffcc33;--ok:#1f9d55;--bad:#d64545;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0f1c;--fg:#eef0fa;--card:#181c33;--line:#2b3157;--mute:#9aa2cc}}
:root[data-theme="dark"]{--bg:#0d0f1c;--fg:#eef0fa;--card:#181c33;--line:#2b3157;--mute:#9aa2cc}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
h1{font:700 20px Georgia,serif;margin:0;color:var(--gold);background:var(--blue);padding:4px 12px;border-radius:6px;letter-spacing:.5px}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button{cursor:pointer;font-weight:600}button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--blue);color:#fff;border-color:var(--blue)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}button.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
button.on{background:var(--gold);color:#111;border-color:var(--gold)}
main{padding:16px;max-width:1300px;margin:0 auto}
.note{color:var(--mute);font-size:14px}
.warn{background:#fff3cd;color:#5a4400;padding:8px 12px;border-radius:8px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.card input,.card textarea,.card select{width:100%;margin:3px 0}
.cl{border-top:1px solid var(--line);padding:8px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.board{display:grid;gap:6px;overflow-x:auto}
.bc{background:var(--blue);color:var(--gold);font:700 clamp(18px,3.4vw,42px) Georgia,serif;text-align:center;padding:clamp(10px,2.2vw,28px) 4px;border-radius:4px;border:0;min-height:56px}
.bc.h{font-size:clamp(11px,1.6vw,20px);text-transform:uppercase;color:#fff;display:flex;align-items:center;justify-content:center;min-height:70px}
.bc.used{visibility:hidden}
.stage{background:var(--blue);color:#fff;border-radius:12px;padding:28px;text-align:center;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.stage .t{font:700 clamp(22px,4vw,46px) Georgia,serif;text-transform:uppercase;max-width:900px}
.stage .m{color:var(--gold);font-weight:700;letter-spacing:1px}
.stage video{max-width:100%;max-height:50vh;border-radius:8px}
.ctl{margin:14px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.score{display:flex;gap:10px;flex-wrap:wrap}
.pl{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:8px 14px;min-width:120px;text-align:center}
.pl.hot{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}.pl.ctrl{border-color:var(--ok)}
.pl b{display:block;font-size:22px}
.phone{min-height:100vh;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:20px;text-align:center}
.phone .card{width:min(100%,520px);text-align:left}
.answer-pad{width:min(90vw,520px);height:180px;border:2px solid var(--line);border-radius:10px;background:#fff;touch-action:none}
.vote-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;width:min(94vw,560px)}
.vote-list button{min-height:48px}
.answer-reveal{font:700 clamp(24px,4vw,48px) Georgia,serif;text-transform:uppercase;max-width:1000px;overflow-wrap:anywhere}
.category-reveal{font:700 clamp(30px,6vw,72px) Georgia,serif;text-transform:uppercase;color:var(--gold)}
.countdown{font:700 clamp(28px,5vw,56px) Georgia,serif;color:var(--gold)}
.buzz{width:min(78vw,340px);height:min(78vw,340px);border-radius:50%;border:0;font-size:36px;font-weight:800;color:#fff;background:#c9362f;box-shadow:0 10px 0 #7d1d19;touch-action:manipulation}
.buzz:active{transform:translateY(8px);box-shadow:0 2px 0 #7d1d19}
.buzz.g{background:#8a90ad;box-shadow:0 10px 0 #5a5f78}
.big{font-size:28px;font-weight:700}
footer{padding:16px;text-align:center}
body.play main{max-width:none;padding:10px 14px}
body.play header{padding:6px 14px}
body.play footer{display:none}
body.play .board{min-height:calc(100vh - 215px);grid-template-rows:auto repeat(5,1fr)}
body.play .bc{font-size:clamp(24px,5vw,72px)}
body.play .bc.h{font-size:clamp(13px,1.9vw,28px)}
body.play .stage{min-height:calc(100vh - 240px)}
</style>
</head>
<body>
<div id="app"></div>
<footer class="note">Board concept inspired by <a href="https://jeopardy.brianyu.me/" target="_blank" rel="noopener">Brian Yu’s Jeopardy game player</a>. Not affiliated with Jeopardy! or Sony.</footer>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js'"></script>
<script>
/* ---- Peer-to-peer room (replaces the claude.ai room) ---- */
const PJ='jeopardy-night-';
const PEER_OPTIONS=window.JEOPARDY_PEER_OPTIONS||{};
const LAN_MODE=location.hostname==='localhost'||location.hostname==='127.0.0.1'||location.hostname.endsWith('.local')||/^\d{1,3}(?:\.\d{1,3}){3}$/.test(location.hostname);
function makeRoom(){const h={};return{on:(t,f)=>{(h[t]=h[t]||[]).push(f)},_d:(t,d)=>{(h[t]||[]).forEach(f=>{try{f({data:d})}catch(e){console.error(e)}})}}}
async function lanPost(path,data){
  const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
  if(!res.ok)throw new Error((await res.text())||`LAN server returned ${res.status}`);
  return res.json();
}
function lanPollUrl(code,clientId){return'/api/room/poll?'+new URLSearchParams({code,clientId})}
function lanHostRoom(onReady,previousCode=''){
  const r=makeRoom();let active=true,redirectCode='';
  r.emit=(t,d)=>{lanPost('/api/room/send',{code:r.code,clientId:r.clientId,t,d}).catch(e=>console.error('Could not send LAN room message',e))};
  r.redirect=code=>{redirectCode=code;r.emit('new-room',{code})};
  r.close=()=>{active=false};
  const poll=async()=>{
    while(active){
      try{
        const res=await fetch(lanPollUrl(r.code,r.clientId));
        if(!res.ok)throw new Error(`LAN server returned ${res.status}`);
        const body=await res.json();
        if(redirectCode)return;
        (body.messages||[]).forEach(m=>r._d(m.t,m.d));
      }catch(e){console.error('LAN room connection lost',e);await new Promise(resolve=>setTimeout(resolve,1500))}
    }
  };
  lanPost('/api/room/create',{previousCode}).then(result=>{
    r.code=result.code;r.clientId=result.clientId;r.joinBase=result.joinBase;r.joinBases=result.joinBases||[result.joinBase];onReady(r);poll();
  }).catch(e=>{console.error('Could not create LAN room',e);r.lastError=String(e&&e.message||e);onReady(null,r.lastError)});
  return r;
}
function lanPlayerRoom(code,onReady){
  const r=makeRoom();let active=false,retryTimer=null,notified=false;
  r.status='connecting';r.connected=false;
  const ready=()=>{if(!notified){notified=true;onReady(r)}};
  const status=s=>{r.status=s;r.connected=s==='connected';r._d('_status',s)};
  const poll=async()=>{
    if(active)return;
    active=true;clearTimeout(retryTimer);status('connecting');
    try{
      const joined=await lanPost('/api/room/join',{code,clientId:r.clientId});
      if(joined.redirectCode){location.replace(joinUrl(joined.redirectCode));active=false;return}
      status('connected');ready();r._d('_open',1);
      while(active){
        const res=await fetch(lanPollUrl(code,r.clientId));
        if(!res.ok)throw new Error(`LAN server returned ${res.status}`);
        const body=await res.json();
        status('connected');
        for(const m of body.messages||[]){
          if(m.t==='new-room'&&m.d&&m.d.code){location.replace(joinUrl(m.d.code));active=false;return}
          r._d(m.t,m.d);
        }
      }
    }catch(e){
      console.error('LAN room connection lost',e);
      r.lastError=String(e&&e.message||e);
      status('retrying');ready();active=false;
      retryTimer=setTimeout(poll,1500);
    }
  };
  r.emit=(t,d)=>{if(r.clientId)lanPost('/api/room/send',{code,clientId:r.clientId,t,d}).catch(e=>console.error('Could not send LAN room message',e))};
  r.retry=()=>{active=false;clearTimeout(retryTimer);poll()};
  const id=ls.get('jp_transport_id')||('l'+Math.random().toString(36).slice(2,14));
  r.clientId=id;ls.set('jp_transport_id',id);
  poll();
  return r;
}
function hostRoom(onReady,previousCode=''){
  if(LAN_MODE)return lanHostRoom(onReady,previousCode);
  const r=makeRoom(),conns=new Set();let peer,tries=0,done=false,timer;
  const fin=(v,error='')=>{if(!done){done=true;clearTimeout(timer);onReady(v,error||r.lastError||'')}};
  r.emit=(t,d)=>conns.forEach(c=>{try{c.open&&c.send({t,d})}catch(e){console.error('Could not send room message',e)}});
  r.close=()=>{conns.forEach(c=>c.close());conns.clear();if(peer&&!peer.destroyed)peer.destroy()};
  r.redirect=code=>{r.redirectCode=code;r.emit('new-room',{code})};
  const start=()=>{
    const A='ABCDEFGHJKMNPQRSTUVWXYZ23456789';let code='';
    do{code='';for(let i=0;i<6;i++)code+=A[Math.floor(Math.random()*A.length)]}while(code===previousCode);
    let attempt;try{if(typeof Peer!=='function')throw new Error('PeerJS did not load from either CDN.');attempt=new Peer(PJ+code,PEER_OPTIONS)}catch(e){r.lastError=String(e&&e.message||e);fin(null);return}
    peer=attempt;
    attempt.on('open',()=>{if(done||peer!==attempt)return;r.code=code;fin(r)});
    attempt.on('error',e=>{
      if(done||peer!==attempt)return;
      if(e.type==='unavailable-id'&&tries++<5){attempt.destroy();start()}
      else{r.lastError=e.message||e.type||'PeerJS connection failed';attempt.destroy();fin(null)}
    });
    attempt.on('connection',c=>{conns.add(c);c.on('open',()=>{if(r.redirectCode)c.send({t:'new-room',d:{code:r.redirectCode}})});c.on('data',m=>m&&r._d(m.t,m.d));c.on('close',()=>conns.delete(c));c.on('error',()=>conns.delete(c))})
  };
  timer=setTimeout(()=>{if(peer&&!peer.destroyed)peer.destroy();r.lastError='PeerJS room creation timed out. Check internet access to the PeerJS service.';fin(null,r.lastError)},10000);
  start();
  return r;
}
function playerRoom(code,onReady){
  if(LAN_MODE)return lanPlayerRoom(code,onReady);
  const r=makeRoom();let conn=null,peer=null,retryTimer=null,delay=1500,notified=false;
  const ready=()=>{if(!notified){notified=true;onReady(r)}};
  r.status='connecting';r.connected=false;
  const status=s=>{r.status=s;r.connected=s==='connected';r._d('_status',s)};
  const schedule=ms=>{clearTimeout(retryTimer);retryTimer=setTimeout(connect,ms)};
  const discardConnection=()=>{
    const c=conn;conn=null;
    if(c)try{c.close()}catch(e){console.error('Could not close room connection',e)}
  };
  const connect=()=>{
    if(!peer||peer.destroyed||conn)return;
    status('connecting');
    let c;try{c=peer.connect(PJ+code,{reliable:true})}catch(e){r.lastError=String(e&&e.message||e);status('error');schedule(delay);delay=Math.min(delay*2,10000);return}
    conn=c;
    const failed=()=>{
      if(conn!==c)return;
      r.lastError='Peer connection closed. Check firewall, VPN, and NAT/TURN relay requirements.';
      conn=null;
      status('retrying');
      try{c.close()}catch(e){console.error('Could not close room connection',e)}
      schedule(delay);delay=Math.min(delay*2,10000);
    };
    c.on('open',()=>{if(conn!==c)return;delay=1500;status('connected');r._d('_open',1)});
    c.on('data',m=>{if(m&&m.t==='new-room'&&m.d&&m.d.code){location.replace(joinUrl(m.d.code));return}if(m)r._d(m.t,m.d)});
    c.on('close',failed);
    c.on('error',failed);
  };
  const openPeer=()=>{
    let attempt;try{if(typeof Peer!=='function')throw new Error('PeerJS did not load from either CDN.');attempt=new Peer(undefined,PEER_OPTIONS)}catch(e){r.lastError=String(e&&e.message||e);status('error');ready();return}
    peer=attempt;
    attempt.on('open',()=>{if(peer!==attempt)return;ready();connect()});
    attempt.on('error',e=>{
      if(peer!==attempt)return;
      r.lastError=e.message||e.type||'PeerJS connection failed';
      if(e.type==='peer-unavailable'){discardConnection();status('unavailable');schedule(3000)}
      else{status('error');schedule(5000)}
      ready();
    });
    attempt.on('disconnected',()=>{if(peer!==attempt)return;status('error');try{attempt.reconnect()}catch(e){console.error('Could not reconnect to signaling server',e)}});
  };
  r.emit=(t,d)=>{try{if(conn&&conn.open){conn.send({t,d});return true}}catch(e){console.error('Could not send room message',e)}return false};
  r.retry=()=>{
    clearTimeout(retryTimer);conn=null;
    if(peer&&!peer.destroyed)peer.destroy();
    peer=null;delay=1500;status('connecting');openPeer();
  };
  openPeer();
  return r;
}
const pageBase=()=>((LAN_MODE&&room&&room.joinBase)?room.joinBase:location.href.split(/[?#]/)[0]);
const joinUrl=code=>pageBase()+'?join='+encodeURIComponent(code);
const joinPageUrl=()=>pageBase()+'?join';
const roomBases=()=>room&&Array.isArray(room.joinBases)&&room.joinBases.length?room.joinBases:[pageBase()];
</script>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let room=null, assets=null;
const params=new URLSearchParams(location.search);
const joinRequested=params.has('join');
const joinCode=(params.get('join')||'').trim();
const isPlayer=joinRequested;
const emit=(t,d)=>{try{room&&room.emit(t,d)}catch(e){}};
const formatTime=seconds=>`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;

/* ================= PHONE BUZZER ================= */
if(isPlayer){
  let S=null, me={
    id:ls.get('jp_id')||('p'+Math.random().toString(36).slice(2,9)),
    name:ls.get('jp_name')||'',mode:ls.get('jp_mode')||'solo',team:ls.get('jp_team')||''
  }, answerStrokes=[], drawing=false;
  ls.set('jp_id',me.id);
  const join=()=>{if(me.name)emit('join',{id:me.id,name:me.name,mode:me.mode,team:me.team})};
  const teamKey=p=>p&&p.mode==='team'?'team:'+encodeURIComponent(String(p.team||'').trim().toLowerCase()):'solo:'+p.id;
  const myGroup=()=>teamKey({id:me.id,mode:me.mode,team:me.team});
  const saveProfile=()=>{ls.set('jp_name',me.name);ls.set('jp_mode',me.mode);ls.set('jp_team',me.team)};
  const pickForm=(code='')=>`<div class="phone"><h1>GhostHaus Christmas Jeopardy</h1><div class="card">
    <h2>Join a game</h2><label>Room code<input id="jc" value="${esc(code)}" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="6-character code"></label>
    <label>Your name<input id="nm" value="${esc(me.name)}" maxlength="16" autocomplete="name" placeholder="Your name"></label>
    <label>Play style<select id="pm"><option value="solo"${me.mode==='solo'?' selected':''}>Solo player</option><option value="team"${me.mode==='team'?' selected':''}>Team member</option></select></label>
    <label id="team-label">Team name<input id="tn" value="${esc(me.team)}" maxlength="24" placeholder="Enter your team name"></label>
    <button class="pri" id="go" style="width:100%">Join game</button>
    <p class="note">Solo players can pick clues. Team members must agree on a clue before their team vote is counted.</p>
  </div></div>`;
  const draw=()=>{
    if(!joinCode){app.innerHTML=pickForm();const pm=$('#pm'),label=$('#team-label');label.hidden=pm.value!=='team';pm.onchange=()=>{label.hidden=pm.value!=='team'};
      $('#go').onclick=()=>{const v=$('#jc').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');if(v.length!==6){alert('Enter the 6-character room code.');return}
        me.name=$('#nm').value.trim();me.mode=$('#pm').value;me.team=$('#tn').value.trim();
        if(!me.name||me.mode==='team'&&!me.team){alert('Enter your name and, for team play, a team name.');return}
        saveProfile();location.search='?join='+encodeURIComponent(v)};return}
    if(!me.name){app.innerHTML=pickForm(joinCode.toUpperCase());const pm=$('#pm'),label=$('#team-label');label.hidden=pm.value!=='team';pm.onchange=()=>{label.hidden=pm.value!=='team'};
      $('#go').onclick=()=>{me.name=$('#nm').value.trim();me.mode=$('#pm').value;me.team=$('#tn').value.trim();
        if(!me.name||me.mode==='team'&&!me.team){alert('Enter your name and, for team play, a team name.');return}
        saveProfile();join();draw()};return}
    if(!room){app.innerHTML=`<div class="phone"><div class="big">Connecting…</div><p class="note">Connecting to the game service.</p></div>`;return}
    if(!S||!room.connected){
      const message=room.status==='unavailable'?'Host not found. Check the room code and make sure the host has started the game.':
        room.status==='retrying'?'Connection lost. Retrying… Check that the host is still running and that both devices can reach this network.':
        room.status==='error'?'Could not reach the connection service. On LAN, verify both devices use the host laptop’s printed address; over internet, check the network firewall and try another network.':
        room.connected?'Connected to host. Waiting for the game…':'Connecting to host…';
      app.innerHTML=`<div class="phone"><div class="big">Hi ${esc(me.name)}!</div><p class="note">${message}</p>${room.lastError?`<details><summary>Connection details</summary><code>${esc(room.lastError)}</code></details>`:''}<button class="pri" id="retry">Retry connection</button></div>`;return
    }
    const p=S.players[me.id]; const sc=p?p.s:0; let h=`<div class="phone"><div class="note">${esc(me.name)}${me.mode==='team'?' · '+esc(me.team):' · Solo'}</div><div class="big">$${sc}</div>`;
    const wagerBox=(max,label)=>`<div>${label}</div><input id="wg" type="number" inputmode="numeric" min="0" max="${max}" placeholder="0–${max}" style="font-size:26px;text-align:center;width:180px"><button class="pri" id="wb">Lock in wager</button>`;
    if(S.phase==='clue'){
      const mine=S.buzzer===me.id, locked=S.locked.includes(me.id);
      h+=`<button class="buzz ${S.open&&!locked?'':'g'}" id="bz" ${S.open&&!locked?'':'disabled'}>${mine?'YOU’RE IN!':locked?'LOCKED':S.open?'BUZZ':'WAIT'}</button>`;
      if(S.buzzer&&!mine)h+=`<div class="note">${esc(S.players[S.buzzer]?.n||'Someone')} buzzed first</div>`;
    }else if(S.phase==='board'){
      const selected=S.votes&&S.votes[me.id];
      h+=`<div class="big">Choose the next clue</div><div class="note">${me.mode==='team'?'Team vote counts when every connected team member chooses the same clue.':'Your pick starts the clue; the host will open the buzzers.'}${selected?' Your current pick is highlighted.':''}</div>
        <div class="vote-list">${(S.board||[]).map(q=>`<button data-vote="${q.key}" class="${selected===q.key?'on':''}">${esc(q.category)} · $${q.value}</button>`).join('')||'<span class="note">No clues remain on this board.</span>'}</div>`;
    }else if(S.phase==='ddwager'){
      h+=S.control===me.id?`<div class="big">DAILY DOUBLE!</div>`+wagerBox(S.maxW,'Wager (min $5)'):`<div class="note">${esc(S.players[S.control]?.n||'A player')} is wagering on a Daily Double…</div>`;
    }else if(S.phase==='fwager'){
      const eligible=sc>0, lockedW=(S.wagered||[]).includes(myGroup());
      h+=eligible&&!lockedW?`<div class="big">Final: ${esc(S.fcat)}</div>`+wagerBox(sc,'Wager up to $'+sc):`<div class="note">${eligible?'Your team’s wager is locked.':'Final Jeopardy: your team needs a positive score to play.'}</div>`;
    }else if(S.phase==='fans'){
      const already=(S.answered||[]).includes(myGroup());
      h+=sc>0&&!already&&S.remaining>0?`<div class="big">Write your answer</div><div class="countdown">${formatTime(S.remaining)}</div><canvas class="answer-pad" id="pad" aria-label="Handwriting area"></canvas><div class="row"><button id="clear-pad">Clear writing</button><button id="toggle-typing">Type instead</button></div><textarea id="fa" rows="2" placeholder="Typed answer (optional)" style="display:none;width:90%;font-size:20px"></textarea><button class="pri" id="fb">Lock in answer</button>`:`<div class="note">${already?'Your team’s answer is locked.':S.remaining<=0?'Time is up. Waiting for the host to reveal answers.':'Watch the screen!'}</div>`;
    }else h+=`<div class="note">${S.phase==='board'?'Pick is on the big screen':'Look at the big screen'}${S.control===me.id&&S.phase==='board'?' — <b>you have control!</b>':''}</div>`;
    app.innerHTML=h+'</div>';
    const bz=$('#bz');if(bz)bz.onpointerdown=()=>{emit('buzz',{id:me.id});try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}};
    document.querySelectorAll('[data-vote]').forEach(b=>b.onclick=()=>emit('vote',{id:me.id,key:b.dataset.vote}));

  app.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;const id=b.id;
    if(id==='tE'&&!started){tab='edit';app.dataset.t='';render()} else if(id==='tP'||id==='toplay')startGame(b);
    else if(id==='copyjoin'){const url=joinUrl(room.code);if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(()=>{b.textContent='Copied!'}).catch(e=>{console.error('Could not copy join link',e);prompt('Copy this join link:',url)});else prompt('Copy this join link:',url)}
    else if(id==='joinpage')window.open(joinPageUrl(),'_blank','noopener');
    else if(id==='fs'){try{document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}
    else if(id==='r1'||id==='r2'){er=id==='r1'?1:2;app.dataset.t='';render()}
    else if(id==='next-category'){if(introIndex+1<CATS().length)introIndex++;else{phase='board';introIndex=0}push()}
    else if(id==='nr'){pr=2;used=new Set();phase='intro';introIndex=0;cur=null;ans=false;votes={};const ids=pid();if(ids.length)control=ids.sort((a,b)=>scoreOf(a)-scoreOf(b))[0];push()}
    else if(id==='addc'){CATS().push({name:'Category '+(CATS().length+1),clues:Array.from({length:5},blank)});save();app.dataset.t='';render()}
    else if(id==='rmc'&&CATS().length>1){CATS().pop();save();app.dataset.t='';render()}
    else if(b.dataset.c!==undefined&&b.classList.contains('bc'))startClue(+b.dataset.c,+b.dataset.i);
    else if(id==='openb'){open=true;push()} else if(id==='close'){open=false;push()}
    else if(id==='reveal'){reveal();push()}
    else if(id==='right'){if(phase==='dd')scores[groupOf(control)]=(scores[groupOf(control)]||0)+ddW;else{scores[groupOf(buzzer)]=(scores[groupOf(buzzer)]||0)+val();control=buzzer}buzzer=null;reveal();push()}
    else if(id==='wrong'){if(phase==='dd'){scores[groupOf(control)]=(scores[groupOf(control)]||0)-ddW;reveal()}else{scores[groupOf(buzzer)]=(scores[groupOf(buzzer)]||0)-val();locked.push(buzzer);buzzer=null;
        if(locked.length>=pid().length)reveal();else open=true}push()}
    else if(id==='back'){phase='board';cur=null;ans=false;push()}
    else if(id==='setw'){const v=parseInt($('#mw').value,10);if(!isNaN(v))applyWager(control,v)}
    else if(id==='fin'){phase='fwager';finalWagers={};finalAnswers={};finalGroups=elig();done={};push()}
    else if(id==='fshow'){phase='fans';finalDeadline=Date.now()+60000;finalTimeExpired=false;push()}
    else if(id==='frev'&&finalTimeExpired){phase='freveal';answerIndex=0;push()}
    else if(id==='fcorrect'||id==='fwrong'||id==='fskip'){
      const group=finalGroups[answerIndex];
      if(group&&id!=='fskip')scores[group]=(scores[group]||0)+(id==='fcorrect'?1:-1)*(finalWagers[group]||0);
      if(group)done[group]=1;answerIndex++;push()
    }
    else if(id==='fend'){phase='over';push()}
    else if(id==='exp'){const g=JSON.parse(JSON.stringify(G));['r1','r2'].forEach(r=>g[r].cats.forEach(c=>c.clues.forEach(q=>q.media='')));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(g,null,2)],{type:'application/json'}));a.download='jeopardy-game.json';a.click()}
  });
  app.addEventListener('change',e=>{
    const t=e.target;
    if(t.id==='imp'&&t.files[0]){t.files[0].text().then(x=>{const n=norm(JSON.parse(x));if(!n)throw 0;G=n;save();app.dataset.t='';render()}).catch(()=>alert('That file isn’t a valid game export.'));return}
    
    if(t.id==='ctrl'){control=t.value||null;push();return}
    if(t.dataset.f==='file'&&t.files[0]&&assets){const q=CATS()[t.dataset.c].clues[t.dataset.i];t.disabled=true;
      assets.upload(t.files[0]).then(r=>{q.media=r.url;q.mname=t.files[0].name;save();app.dataset.t='';render()}).catch(()=>{t.disabled=false;alert('Upload failed (max 20 MB).')});return}
    if(t.dataset.f==='type'||t.dataset.f==='dd'){const q=CATS()[t.dataset.c].clues[t.dataset.i];
      if(t.dataset.f==='dd')q.dd=t.checked;else{q.type=t.value;q.media='';q.mname=''}save();app.dataset.t='';render()}
  });
  app.addEventListener('input',e=>{
    const t=e.target,f=t.dataset.f;if(!f)return;
    if(f==='fcat')G.final.cat=t.value;else if(f==='fclue')G.final.clue=t.value;else if(f==='fans')G.final.ans=t.value;
    else if(f==='name')CATS()[t.dataset.c].name=t.value;
    else if(f==='text'||f==='ans')CATS()[t.dataset.c].clues[t.dataset.i][f]=t.value;
    save();
  });
  init();
}
</script>
</body>
</html>
